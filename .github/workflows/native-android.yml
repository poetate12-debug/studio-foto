name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android-foundation]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

concurrency:
  group: reang-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native debug APK
        working-directory: native-android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reang-studio-foto-native-preview
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
