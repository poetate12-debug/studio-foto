name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android-foundation]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: write

concurrency:
  group: reang-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;35.0.0 ndk;29.0.14206865'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Rust toolchain for LightCraft
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Fetch pinned LightCraft engine source
        run: |
          git clone https://github.com/artcraft-android/lightcraft-android.git "$RUNNER_TEMP/lightcraft"
          git -C "$RUNNER_TEMP/lightcraft" checkout 7eb9f0e7e2bb6314879bd9f272a2b12f011f00b2
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/lightcraft-target" >> "$GITHUB_ENV"

      - name: Build LightCraft Rust engine and generate Kotlin bindings
        env:
          LIGHTCRAFT_DIR: ${{ runner.temp }}/lightcraft
        run: |
          cargo ndk -t arm64-v8a --platform 29 -o "$GITHUB_WORKSPACE/native-android/app/src/main/jniLibs" build --release --locked -p lightcraft-android --lib
          mkdir -p "$GITHUB_WORKSPACE/native-android/app/build/generated/source/lightcraft/kotlin"
          cargo run --quiet --locked -p lightcraft-android-bindgen --manifest-path "$LIGHTCRAFT_DIR/apps/lightcraft-android/bindgen/Cargo.toml" -- generate \
            --library "$CARGO_TARGET_DIR/aarch64-linux-android/release/liblightcraft_android.so" \
            --language kotlin \
            --out-dir "$GITHUB_WORKSPACE/native-android/app/build/generated/source/lightcraft/kotlin" \
            --no-format
        working-directory: ${{ runner.temp }}/lightcraft
      - name: Restore permanent signing key
        env:
          REANG_KEYSTORE_BASE64: ${{ secrets.REANG_KEYSTORE_BASE64 }}
          REANG_KEYSTORE_PASSWORD: ${{ secrets.REANG_KEYSTORE_PASSWORD }}
          REANG_KEY_ALIAS: ${{ secrets.REANG_KEY_ALIAS }}
        run: |
          test -n "$REANG_KEYSTORE_BASE64" || (echo "Missing GitHub secret REANG_KEYSTORE_BASE64" && exit 1)
          test -n "$REANG_KEYSTORE_PASSWORD" || (echo "Missing GitHub secret REANG_KEYSTORE_PASSWORD" && exit 1)
          test -n "$REANG_KEY_ALIAS" || (echo "Missing GitHub secret REANG_KEY_ALIAS" && exit 1)
          echo "$REANG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reang-upload.p12"
          echo "REANG_KEYSTORE_PATH=$RUNNER_TEMP/reang-upload.p12" >> "$GITHUB_ENV"
          echo "REANG_KEY_ALIAS=$REANG_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "REANG_KEYSTORE_PASSWORD=$REANG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed native release APK
        working-directory: native-android
        run: gradle assembleRelease --stacktrace
      - name: Verify APK package and signing certificate
        run: |
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          ACTUAL_PACKAGE=$("$AAPT" dump badging "$APK" | awk -F"'" '/^package: name=/{print $2; exit}')
          test "$ACTUAL_PACKAGE" = "id.reang.studiofoto.nativeapp"
          EXPECTED=$(keytool -list -v -keystore "$REANG_KEYSTORE_PATH" -storepass "$REANG_KEYSTORE_PASSWORD" -alias "$REANG_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          echo "Expected certificate: $EXPECTED"
          echo "APK certificate:      $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
      - name: Upload signed native APK
        uses: actions/upload-artifact@v4
        with:
          name: reang-studio-foto-native-signed
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-build-${{ github.run_number }}
          name: Reang Studio Foto Native - Build ${{ github.run_number }}
          body: Signed Kotlin and Jetpack Compose native Android preview.
          files: native-android/app/build/outputs/apk/release/app-release.apk
          make_latest: false
