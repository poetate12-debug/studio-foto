name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install app dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Validate front-end JavaScript syntax
        run: |
          python3 - <<'PY'
          source = open("index.html", encoding="utf-8").read()
          blocks = []
          pos = 0
          while True:
              tag = source.find("<script", pos)
              if tag < 0:
                  break
              content_start = source.find(">", tag) + 1
              content_end = source.find("</script>", content_start)
              if content_start == 0 or content_end < 0:
                  raise SystemExit("Malformed script element in index.html")
              blocks.append(source[content_start:content_end])
              pos = content_end + len("</script>")
          if not blocks:
              raise SystemExit("No JavaScript found in index.html")
          with open("/tmp/reang-index-inline.js", "w", encoding="utf-8") as output:
              output.write("\n;\n".join(blocks))
          print(f"Found {len(blocks)} inline script blocks")
          PY
          node --check /tmp/reang-index-inline.js

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
        env:
          CI: true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reang-studio-foto-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-20261024
          name: Reang Studio Foto Android (Tes Tombol fal.ai)
          body: |
            APK pengujian otomatis terbaru untuk Reang Studio Foto.
            Ini build debug; fitur AI mungkin belum aktif penuh.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
