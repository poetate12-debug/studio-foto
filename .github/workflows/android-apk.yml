name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'native-download.js'
      - 'android-native/**'
      - 'scripts/**'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: reang-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install app dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Bundle Capacitor native download bridge
        run: npx esbuild native-download.js --bundle --format=iife --target=es2020 --outfile=www/native-download.bundle.js

      - name: Validate front-end JavaScript syntax
        run: |
          python3 - <<'PY'
          source = open("index.html", encoding="utf-8").read()
          blocks = []
          pos = 0
          while True:
              tag = source.find("<script", pos)
              if tag < 0:
                  break
              content_start = source.find(">", tag) + 1
              content_end = source.find("</script>", content_start)
              if content_start == 0 or content_end < 0:
                  raise SystemExit("Malformed script element in index.html")
              blocks.append(source[content_start:content_end])
              pos = content_end + len("</script>")
          if not blocks:
              raise SystemExit("No JavaScript found in index.html")
          with open("/tmp/reang-index-inline.js", "w", encoding="utf-8") as output:
              output.write("\n;\n".join(blocks))
          print(f"Found {len(blocks)} inline script blocks")
          PY
          node --check /tmp/reang-index-inline.js
          node scripts/smoke-check.mjs

      - name: Generate Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/id/reang/studiofoto
          cp android-native/NativeDownloaderPlugin.java android/app/src/main/java/id/reang/studiofoto/NativeDownloaderPlugin.java
          cat > android/app/src/main/java/id/reang/studiofoto/MainActivity.java <<'JAVA'
          package id.reang.studiofoto;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeDownloaderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          npx cap sync android
        env:
          CI: true

      - name: Restore stable Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing repository Actions secret ANDROID_DEBUG_KEYSTORE_BASE64. Add the persistent debug keystore before building APKs so updates can install over the previous version."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'

      - name: Force Gradle to use the persistent signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          source = path.read_text(encoding='utf-8')
          if 'signingConfigs {' not in source:
              source, count = re.subn(
                  r'android\\s*\\{',
                  '''android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }''',
                  source, count=1
              )
              if count != 1: raise SystemExit('Could not insert persistent signingConfigs into app/build.gradle')
          if not re.search(r'buildTypes\\s*\\{[\\s\\S]*?debug\\s*\\{\\s*signingConfig\\s+signingConfigs\\.debug', source):
              source, count = re.subn(r'buildTypes\\s*\\{', 'buildTypes {\\n        debug { signingConfig signingConfigs.debug }', source, count=1)
              if count != 1: raise SystemExit('Could not pin debug buildType to persistent signing config')
          path.write_text(source, encoding='utf-8')
          print('Pinned debug signing to $HOME/.android/debug.keystore')
          PY
          cd android
          chmod +x gradlew
          ./gradlew signingReport --console=plain

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK certificate matches persistent key
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then echo "::error::apksigner not found at $APKSIGNER"; exit 1; fi
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')
          echo "Expected signing certificate: $EXPECTED"
          echo "APK signing certificate:      $ACTUAL"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signature does not match the persistent repository signing key; refusing to publish."
            exit 1
          fi
          echo "APK certificate verified against persistent key."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reang-studio-foto-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-workflow-20261024-${{ github.run_number }}
          name: "Reang Studio Foto Android (Alur 5 Tahap) #${{ github.run_number }}"
          body: |
            APK Android berisi perbaikan error label dan alur proyek terpisah: Cahaya → Cutout → Template → Enhance → Export.
            Hasil AI disimpan ke folder Download/ReangStudioFoto dan cache aplikasi untuk digunakan pada tahap berikutnya.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
