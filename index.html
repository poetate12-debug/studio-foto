<script>
(function(){
  function showBootError(title, detail) {
    const main = document.getElementById('main');
    if (!main) return;
    main.innerHTML = '<section class="panel"><h2></h2><p class="lead"></p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:35vh;overflow:auto;background:#f5f6fa;padding:10px;border-radius:8px"></pre><button class="btn primary" id="boot-reload">Muat ulang aplikasi</button></section>';
    main.querySelector('h2').textContent = title;
    main.querySelector('.lead').textContent = 'Aplikasi mengalami kendala saat memuat. Detail di bawah dapat membantu perbaikan.';
    main.querySelector('pre').textContent = String(detail || 'Tidak ada detail error.');
    const button = document.getElementById('boot-reload');
    if (button) button.onclick = () => location.reload();
  }
  function showRuntimeNotice(message) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const item = document.createElement('div');
    item.className = 'toast';
    item.textContent = 'Terjadi kesalahan: ' + String(message || 'operasi tidak berhasil');
    root.replaceChildren(item);
  }
  window.addEventListener('error', function(event) {
    if (event.target && event.target !== window) return;
    const message = (event.message || 'Kesalahan JavaScript') + (event.filename ? '\n' + event.filename + ':' + event.lineno : '');
    if (!window.__reangAppBooted) showBootError('Reang Studio Foto belum berhasil dimuat', message);
    else { console.error(message); showRuntimeNotice(message); }
  });
  window.addEventListener('unhandledrejection', function(event) {
    const reason = event.reason;
    const message = reason && (reason.stack || reason.message) || String(reason);
    if (!window.__reangAppBooted) showBootError('Proses aplikasi mengalami kesalahan', message);
    else { console.error(message); showRuntimeNotice(message); }
  });
  window.addEventListener('load', function() {
    setTimeout(function() {
      const main = document.getElementById('main');
      if (main && !main.innerHTML.trim()) showBootError('Halaman utama belum tampil', 'Aplikasi dibuka tetapi belum berhasil merender konten. Tekan Muat ulang; jika tetap terjadi, kirim screenshot halaman ini.');
    }, 3000);
  });
})();
</script>

function dbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('templates'))d.createObjectStore('templates',{keyPath:'id'});if(!d.objectStoreNames.contains('backgrounds'))d.createObjectStore('backgrounds',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

function dbPut(store,item){return new Promise((resolve,reject)=>{if(!db){const key='reang-'+store;let arr=[];try{arr=JSON.parse(storageRead(key,'[]'))||[]}catch(e){arr=[]}const i=arr.findIndex(x=>x.id===item.id);i>=0?arr[i]=item:arr.push(item);if(storageWrite(key,JSON.stringify(arr)))resolve(item);else reject(new Error('Penyimpanan lokal tidak tersedia. Aktifkan izin penyimpanan aplikasi atau gunakan browser HTTPS.'));return}try{const r=db.transaction(store,'readwrite').objectStore(store).put(item);r.onsuccess=()=>resolve(item);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}

function renderErrorScreen(error, failedPage){
 const main=document.getElementById('main');

 if(!main)return;
 const detail=String(error&&(error.stack||error.message)||error||'Kesalahan tidak diketahui');
 main.innerHTML='<section class="panel" style="margin:18px auto;max-width:760px"><h2>Halaman tidak dapat ditampilkan</h2><p class="lead">Bagian halaman ini gagal dirender. Proyek dan foto tersimpan tidak dihapus.</p><pre id="render-error-detail" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:32vh;overflow:auto;background:#f5f6fa;padding:12px;border-radius:10px;font-size:11px"></pre><div class="form-row" style="grid-template-columns:1fr 1fr"><button class="btn primary" id="render-error-retry">Coba muat ulang halaman</button><button class="btn" id="render-error-projects">Kembali ke Proyek</button></div></section>';
 const pre=document.getElementById('render-error-detail');
 if(pre)pre.textContent=detail;
 const retry=document.getElementById('render-error-retry');
 if(retry)retry.onclick=()=>{page=failedPage||'projects';render()};
 const projectsButton=document.getElementById('render-error-projects');
 if(projectsButton)projectsButton.onclick=()=>{page='projects';render()};
}
function render(){
 const requestedPage=page;
 try{
  const photoFlow=page==='project-gallery'||page==='photo-editor';
  document.body.classList.toggle('photo-flow-active',photoFlow);
  document.body.classList.toggle('photo-editor-active',page==='photo-editor');
  switch(page){
   case 'project-gallery': renderProjectGallery(); break;
   case 'photo-editor': renderPhotoEditor(); break;
   case 'batch-workflow': page='project-gallery'; renderProjectGallery(); break;
   case 'projects': renderProjects(); break;
   case 'tools': renderTools(); break;
   case 'templates': renderTemplates(); break;
   case 'settings': renderSettings(); break;
   case 'project-editor': renderProjectEditor(); break;
   case 'template-editor': renderTemplateEditor(); break;
   case 'tool-runner': renderToolRunner(); break;
   default: page='projects'; renderProjects(); break;
  }
  setActivePageNav(page);
  window.__reangAppLastSuccessfulRender=Date.now();
  window.__reangAppBooted=true;
  return true;
 }catch(error){
  console.error('Gagal merender halaman '+requestedPage,error);
  page=requestedPage;
  renderErrorScreen(error,requestedPage);
  setActivePageNav(requestedPage);
  window.__reangAppBooted=true;
  return false;
 }
}

function localDateInputValue(value=Date.now()){const date=new Date(value);if(!Number.isFinite(date.getTime()))return new Date().toISOString().slice(0,10);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function projectEventDate(project){if(!project)return'';if(!project.eventDate)project.eventDate=localDateInputValue(project.createdAt||Date.now());return project.eventDate}
function ensureTemplateEventDateLayer(template,project){
 if(!template)return null;
 template.layers=Array.isArray(template.layers)?template.layers:[];
 let layer=template.layers.find(item=>item.id===template.simpleDateLayerId&&item.type==='text');
 if(!layer)layer=template.layers.find(item=>item.type==='text'&&(/TANGGAL ACARA/i.test(String(item.text||''))||/tanggal otomatis/i.test(String(item.name||''))));
 if(!layer){
  layer={id:uid(),name:'Tanggal acara otomatis',type:'text',text:'TANGGAL ACARA',x:8,y:6,w:84,h:9,fontSize:32,color:'#ffffff',bold:true,align:'center',visible:true,locked:false,opacity:1,eventDateAuto:true};
  template.layers.push(layer);
 }
 layer.type='text';layer.text='TANGGAL ACARA';layer.name=layer.name||'Tanggal acara otomatis';layer.visible=true;layer.locked=false;layer.align='center';layer.bold=true;
 layer.x=Number.isFinite(Number(layer.x))?Number(layer.x):8;
 layer.y=Number.isFinite(Number(layer.y))?Number(layer.y):89;
 layer.w=Number.isFinite(Number(layer.w))?Number(layer.w):84;
 layer.h=Number.isFinite(Number(layer.h))?Number(layer.h):7;
 layer.color=layer.color||'#ffffff';
 layer.opacity=Number.isFinite(Number(layer.opacity))?Number(layer.opacity):1;
 layer.eventDateAuto=true;
 layer.fontSize=Math.max(1,Math.min(64,Number(layer.fontSize)||24));
 template.simpleDateLayerId=layer.id;
 template.eventDate=project?projectEventDate(project):(template.eventDate||localDateInputValue());
 return layer;
}

async function photoDataWithLight(ph){

  const image=new Image();
  image.onload=async()=>{
   try{
    const canvas=document.createElement('canvas');

    const ctx=canvas.getContext('2d');
    ctx.filter=photoAdjustmentFilter(ph);ctx.drawImage(image,0,0,canvas.width,canvas.height);ctx.filter='none';

     ctx.save();

     else if(a.highlight<0){ctx.globalAlpha=Math.min(.15,Math.abs(a.highlight)/700);ctx.fillStyle='#241c18';ctx.fillRect(0,0,canvas.width,canvas.height)}
     if(a.shadows>0){ctx.globalAlpha=Math.min(.10,a.shadows/900);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}
     else if(a.shadows<0){ctx.globalAlpha=Math.min(.14,Math.abs(a.shadows)/700);ctx.fillStyle='#211b24';ctx.fillRect(0,0,canvas.width,canvas.height)}

     ctx.save();ctx.globalAlpha=Math.min(.16,a.glow/550);
     const g=ctx.createRadialGradient(canvas.width*.5,canvas.height*.42,0,canvas.width*.5,canvas.height*.42,Math.max(canvas.width,canvas.height)*.65);

     ctx.save();
     const g=ctx.createRadialGradient(canvas.width*.5,canvas.height*.5,Math.min(canvas.width,canvas.height)*.2,canvas.width*.5,canvas.height*.5,Math.max(canvas.width,canvas.height)*.68);
     g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+Math.min(.48,a.vignette/210)+')');

function firstEligiblePhotoIndex(p,targetIndex){
 const photos=p.photos||[];

  0: ph=>!workflowDone(ph,'light'),
  1: ph=>workflowDone(ph,'light')&&!workflowDone(ph,'cutout'),
  2: ph=>workflowDone(ph,'cutout')&&!workflowDone(ph,'template'),
  3: ph=>workflowDone(ph,'cutout')&&workflowDone(ph,'template')&&!workflowDone(ph,'face'),
  4: ph=>workflowDone(ph,'face')&&!workflowDone(ph,'export')
 };
 const fn=eligible[targetIndex];
 if(!fn)return -1;
 let found=photos.findIndex(fn);
 if(found<0){
  const fallback={
   0: ph=>true,
   1: ph=>workflowDone(ph,'light'),
   2: ph=>workflowDone(ph,'cutout'),
   3: ph=>workflowDone(ph,'cutout')&&workflowDone(ph,'template'),
   4: ph=>workflowDone(ph,'face')
  }[targetIndex];
  found=fallback?photos.findIndex(fallback):-1;
 }
 return found;
}

function bindTemplateStageGestures(project,photo){

 if(!stage)return;
 if(overlay)overlay.style.pointerEvents='none';
 stage.style.pointerEvents='auto';stage.style.touchAction='none';
 const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
 const getRect=()=>target()==='background'?templateBackgroundRect(project):templateSubjectRect(photo);
 const target=()=>project.templateAdjustTarget||'subject';
 const pointers=new Map();let drag=null,pinch=null;
 const point=e=>({x:e.clientX,y:e.clientY});
 const distance=pts=>Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
 updateTemplateAdjustOverlay(project,photo);setTemplateAdjustTargetButtons(project,photo);
 stage.addEventListener('pointerdown',event=>{
  event.preventDefault();event.stopPropagation();
  pointers.set(event.pointerId,point(event));
  try{stage.setPointerCapture(event.pointerId)}catch(error){}
  const rect=getRect(),kind=target();
  if(pointers.size===1)drag={kind,x:event.clientX,y:event.clientY,startX:Number(rect.x??0),startY:Number(rect.y??0)};
  if(pointers.size===2){
   drag=null;const pts=[...pointers.values()];
   pinch={kind,distance:distance(pts),w:Number(rect.w??100),h:Number(rect.h??100),cx:Number(rect.x??0)+Number(rect.w??100)/2,cy:Number(rect.y??0)+Number(rect.h??100)/2};
  }
 },{passive:false});
 stage.addEventListener('pointermove',event=>{
  if(!pointers.has(event.pointerId))return;

   const factor=distance([...pointers.values()])/pinch.distance;

    rect.w=clamp(pinch.w*factor,10,100);rect.h=clamp(pinch.h*factor,10,100);
    rect.x=clamp(pinch.cx-rect.w/2,0,100-rect.w);rect.y=clamp(pinch.cy-rect.h/2,0,100-rect.h);
   }else{
    rect.w=clamp(pinch.w*factor,100,300);rect.h=clamp(pinch.h*factor,100,300);
    rect.x=clamp(pinch.cx-rect.w/2,100-rect.w,0);rect.y=clamp(pinch.cy-rect.h/2,100-rect.h,0);
   }
   updateTemplateAdjustOverlay(project,photo);return;
  }
  if(pointers.size===1&&drag&&drag.kind===kind){
   const dx=(event.clientX-drag.x)/Math.max(1,bounds.width)*100,dy=(event.clientY-drag.y)/Math.max(1,bounds.height)*100;
   if(kind==='subject'){rect.x=clamp(drag.startX+dx,0,100-Number(rect.w??82));rect.y=clamp(drag.startY+dy,0,100-Number(rect.h??79))}
   else {rect.x=clamp(drag.startX+dx,100-Number(rect.w??140),0);rect.y=clamp(drag.startY+dy,100-Number(rect.h??140),0)}
   updateTemplateAdjustOverlay(project,photo);
  }
 },{passive:false});
 const finish=async event=>{
  if(!pointers.has(event.pointerId))return;
  pointers.delete(event.pointerId);
  if(pointers.size===0){
   drag=null;pinch=null;
   try{await dbPut('projects',project);await refreshTemplateStagePreview(project,photo)}catch(error){toast('Posisi belum tersimpan.')}

   const remaining=[...pointers.values()][0],rect=getRect();
   drag={kind:target(),x:remaining.x,y:remaining.y,startX:Number(rect.x??0),startY:Number(rect.y??0)};pinch=null;
  }
 };
 stage.addEventListener('pointerup',finish);
 stage.addEventListener('pointercancel',finish);
 stage.addEventListener('lostpointercapture',finish);
}

function bindSimpleDateGestures(t){
 const stage=$('#template-simple-stage'),handle=$('#template-date-handle');
 const layer=t.layers.find(l=>l.id===t.simpleDateLayerId);
 if(!stage||!handle||!layer)return;
 const dateValue=()=>projectEventDate(activeProject())||t.eventDate||'';
 const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
 const paint=()=>{
  handle.style.left=clamp(Number(layer.x??20),0,100)+'%';
  handle.style.top=clamp(Number(layer.y??84),0,100)+'%';
  handle.style.width=clamp(Number(layer.w??60),12,100)+'%';
  handle.style.height=clamp(Number(layer.h??10),5,35)+'%';
  handle.dataset.fontSize=String(Number(layer.fontSize||24));
  const glyph=$('#template-date-text');
  if(glyph){const previewSize=Math.max(.5,Number(layer.fontSize||24)*stage.clientWidth/650);glyph.textContent=dateValue()?fmtDate(dateValue()):'PILIH TANGGAL';glyph.style.setProperty('font-size','36px','important');glyph.style.setProperty('transform','scale('+(previewSize/36)+')','important')}
  const sizeSlider=$('#simple-date-size'),sizeValue=$('#simple-date-size-value');
  if(sizeSlider)sizeSlider.value=Number(layer.fontSize||24);
  if(sizeValue)sizeValue.textContent=Math.round(Number(layer.fontSize||24))+' px';
 };
 paint();
 const pointers=new Map();let move=null,pinch=null;
 const point=e=>({x:e.clientX,y:e.clientY});
 stage.addEventListener('pointerdown',e=>{
  const rect=handle.getBoundingClientRect();
  const startsOnDate=e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom;
  if(pointers.size===0&&!startsOnDate)return;
  e.preventDefault();e.stopPropagation();pointers.set(e.pointerId,point(e));
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===1)move={x:e.clientX,y:e.clientY,startX:Number(layer.x??20),startY:Number(layer.y??84)};
  if(pointers.size===2){
   move=null;const pts=[...pointers.values()];
   pinch={distance:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),font:Number(layer.fontSize||24),w:Number(layer.w||60),h:Number(layer.h||10),cx:Number(layer.x??20)+Number(layer.w??60)/2,cy:Number(layer.y??84)+Number(layer.h??10)/2};
  }
 },{passive:false});
 stage.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,point(e));
  if(pointers.size>=2&&pinch){
   const pts=[...pointers.values()],d=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),factor=d/pinch.distance;
   layer.fontSize=clamp(pinch.font*factor,1,64);layer.w=clamp(pinch.w*factor,12,100);layer.h=clamp(pinch.h*factor,5,35);
   layer.x=clamp(pinch.cx-layer.w/2,0,100-layer.w);layer.y=clamp(pinch.cy-layer.h/2,0,100-layer.h);paint();return;
  }
  if(pointers.size===1&&move){
   const dx=(e.clientX-move.x)/Math.max(1,stage.clientWidth)*100,dy=(e.clientY-move.y)/Math.max(1,stage.clientHeight)*100;
   layer.x=clamp(move.startX+dx,0,100-Number(layer.w||60));layer.y=clamp(move.startY+dy,0,100-Number(layer.h||10));paint();
  }
 },{passive:false});
 const finish=async e=>{
  if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);
  if(pointers.size===0){move=null;pinch=null;await dbPut('templates',t);if(activeProject()){const project=activeProject();project.updatedAt=Date.now();await dbPut('projects',project)}}
  else if(pointers.size===1){const remaining=[...pointers.values()][0];move={x:remaining.x,y:remaining.y,startX:Number(layer.x??20),startY:Number(layer.y??84)};pinch=null}
 };
 stage.addEventListener('pointerup',finish);
 stage.addEventListener('pointercancel',finish);
 stage.addEventListener('lostpointercapture',finish);
}
function applyTemplateCanvasTransform(){const c=$('#template-canvas'),label=$('#template-zoom-label');if(!c)return;c.style.transform='translate('+templatePanX+'px,'+templatePanY+'px) scale('+templateZoom+')';if(label)label.textContent=Math.round(templateZoom*100)+'%'}
function bindTemplateCanvasZoom(){
 const frame=$('#template-canvas-frame'),canvas=$('#template-canvas');if(!frame||!canvas)return;
 const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
 const zoomTo=v=>{templateZoom=clamp(v,.5,4);applyTemplateCanvasTransform()};
 $('#template-zoom-in').onclick=()=>zoomTo(templateZoom*1.2);
 $('#template-zoom-out').onclick=()=>zoomTo(templateZoom/1.2);
 $('#template-zoom-reset').onclick=()=>{templateZoom=1;templatePanX=0;templatePanY=0;applyTemplateCanvasTransform()};
 $('#template-pan-reset').onclick=()=>{templatePanX=0;templatePanY=0;applyTemplateCanvasTransform()};
 const pointers=new Map();
 let drag=null,pan=null,viewportPinch=null,layerPinch=null,redrawTimer=0,lastPreviewDraw=0;
 const canvasPoint=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/Math.max(1,r.width)*canvas.width,y:(e.clientY-r.top)/Math.max(1,r.height)*canvas.height}};
 const selectedRect=l=>({x:normalizedToSize(l.x??0,canvas.width),y:normalizedToSize(l.y??0,canvas.height),w:normalizedToSize(l.w??100,canvas.width),h:normalizedToSize(l.h??100,canvas.height)});
 const inside=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
 const distance=()=>{const a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
 const refreshSliders=l=>{['x','y','w','h'].forEach(k=>{const input=$('#layer-'+k),label=$('#layer-'+k+'-val');if(input)input.value=l[k];if(label)label.textContent=Math.round(l[k])+'%'});const font=$('#layer-font'),fontLabel=$('#layer-font-val');if(font&&l.type==='text'){font.value=Math.min(100,l.fontSize||24);if(fontLabel)fontLabel.textContent=Math.round(l.fontSize||24)+' px'}};
 const queueDraw=()=>{if(redrawTimer)return;const delay=Math.max(0,45-(Date.now()-lastPreviewDraw));redrawTimer=window.setTimeout(()=>{redrawTimer=0;lastPreviewDraw=Date.now();drawTemplateCanvas(t)},delay)};
 const saveSelectedLayer=async layer=>{await dbPut('templates',t);refreshSliders(layer);drawTemplateCanvas(t)};
 frame.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const point=canvasPoint(e);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,point});
  try{frame.setPointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===2){
   drag=null;pan=null;
   const active=currentLayer(),a=[...pointers.values()];
   const layerRect=active?selectedRect(active):null;
   const canScaleLayer=!!(active&&active.visible!==false&&!active.locked&&layerRect&&inside(a[0].point,layerRect)&&inside(a[1].point,layerRect));
   const initialDistance=Math.max(1,distance());
   if(canScaleLayer){
    layerPinch={layer:active,distance:initialDistance,x:Number(active.x??0),y:Number(active.y??0),w:Number(active.w??100),h:Number(active.h??100),fontSize:Number(active.fontSize||24),cx:Number(active.x??0)+Number(active.w??100)/2,cy:Number(active.y??0)+Number(active.h??100)/2};
    viewportPinch=null;
   }else{
    viewportPinch={distance:initialDistance,zoom:templateZoom};
    layerPinch=null;
   }
   return;
  }
  if(pointers.size!==1)return;
  const layer=currentLayer();
  if(layer&&layer.visible!==false){
   const r=selectedRect(layer);
   if(inside(point,r)){
    if(layer.locked){toast('Layer terkunci. Tekan Buka kunci layer atau gunakan tombol +/− Layer di atas.');}
    else{drag={pointerId:e.pointerId,layer,startX:point.x,startY:point.y,layerX:Number(layer.x||0),layerY:Number(layer.y||0)};return}
   }
  }
  if(templateZoom>1)pan={pointerId:e.pointerId,x:e.clientX,y:e.clientY,px:templatePanX,py:templatePanY};
 },{passive:false});
 frame.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const point=canvasPoint(e);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,point});
  if(pointers.size>=2){
   const factor=distance()/(layerPinch?.distance||viewportPinch?.distance||1);
   if(layerPinch){
    const state=layerPinch,layer=state.layer;
    const nw=clamp(state.w*factor,1,200),nh=clamp(state.h*factor,1,200);
    layer.w=nw;layer.h=nh;layer.x=state.cx-nw/2;layer.y=state.cy-nh/2;
    if(layer.type==='text')layer.fontSize=clamp(state.fontSize*factor,8,300);
    refreshSliders(layer);queueDraw();
   }else if(viewportPinch){zoomTo(viewportPinch.zoom*factor)}
   return;
  }
  if(drag&&drag.pointerId===e.pointerId){
   const layer=drag.layer;
   layer.x=clamp(drag.layerX+(point.x-drag.startX)/canvas.width*100,-100,200);
   layer.y=clamp(drag.layerY+(point.y-drag.startY)/canvas.height*100,-100,200);
   refreshSliders(layer);queueDraw();
  }else if(pan&&pan.pointerId===e.pointerId){
   templatePanX=pan.px+e.clientX-pan.x;templatePanY=pan.py+e.clientY-pan.y;applyTemplateCanvasTransform();
  }
 },{passive:false});
 const finish=e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(layerPinch){
   const layer=layerPinch.layer;layerPinch=null;viewportPinch=null;drag=null;pan=null;
   saveSelectedLayer(layer);
  }else if(viewportPinch&&pointers.size<2){viewportPinch=null}
  if(drag&&drag.pointerId===e.pointerId){const layer=drag.layer;drag=null;dbPut('templates',t);drawTemplateCanvas(t)}
  if(pan&&pan.pointerId===e.pointerId)pan=null;
 };
 frame.addEventListener('pointerup',finish);
 frame.addEventListener('pointercancel',finish);
 frame.addEventListener('lostpointercapture',finish);
 frame.addEventListener('wheel',e=>{e.preventDefault();zoomTo(templateZoom*(e.deltaY<0?1.1:.9))},{passive:false});

function prepareFalImage(source,maxSide=3000){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   try{
    const width=img.naturalWidth||img.width,height=img.naturalHeight||img.height;
    if(!width||!height){reject(new Error('Foto tidak dapat dibaca.'));return}
    if(source.startsWith('data:image/')&&source.length<6500000){resolve(source);return}
    const scale=Math.min(1,maxSide/Math.max(width,height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
    const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.92));
   }catch(err){reject(new Error('Gagal menyiapkan foto. Pilih file foto dari perangkat lalu coba lagi.'))}
  };

 const resultUrl=job.response_url||('https://queue.fal.run/'+model+'/requests/'+encodeURIComponent(requestId));
 for(let attempt=0;attempt<180;attempt++){

   if(!completed)throw new Error('Waktu tunggu pemrosesan terlalu lama. Coba periksa saldo/koneksi lalu ulangi.');
   output=await falJson(resultUrl,{method:'GET'},apiKey);
  }
  const imageObject=output.image||(Array.isArray(output.images)?output.images[0]:null)||(output.data&&output.data.image)||null;
  const imageUrl=typeof imageObject==='string'?imageObject:(imageObject&&imageObject.url)||(output.image_url)||null;
  if(!imageUrl)throw new Error('fal.ai merespons, tetapi URL gambar hasil tidak ditemukan. Coba ulangi atau pilih model lain.');
  const outputPath=imageUrl.toLowerCase().split(/[?#]/)[0];
  const outputExt=(outputPath.endsWith('.jpg')||outputPath.endsWith('.jpeg'))?'jpg':'png';
  showFalResult(imageUrl,'Pemrosesan AI selesai','reang-enhance-ai.'+outputExt);
 }catch(error){
  const message=String(error&&error.message||error);
  let suggestion='Periksa koneksi internet, saldo akun, dan model yang dipilih lalu coba kembali.';
  if(error&&error.status===401)suggestion='API key ditolak. Periksa key pada Pengaturan → AI & fal.ai; jangan gunakan key yang sudah dicabut.';
  else if(error&&error.status===403)suggestion='Akun atau API key tidak memiliki akses ke model ini. Cek izin akun dan model yang tersedia.';
  else if(error&&error.status===413)suggestion='Ukuran foto terlalu besar. Coba unggah foto yang lebih kecil.';
  else if(/failed to fetch|networkerror|cors/i.test(message))suggestion='Koneksi langsung terhalang jaringan atau kebijakan CORS WebView. Ini tidak selalu berarti API key salah.';
  result.innerHTML='<div class="notice error"><span>!</span><div><b>Enhancement AI gagal.</b> '+esc(message)+'<br>'+esc(suggestion)+'</div></div>';
 }finally{button.disabled=false;button.textContent='✧ Proses foto'}
}
function renderToolRunner(){
 const key=toolKey;let title=featureName[key]||'Alat AI';
 let html=head('ALAT AI / '+title.toUpperCase(),title,'Pemrosesan langsung melalui model fal.ai. Hasil tersimpan sebagai unduhan terpisah; foto sumber tidak ditimpa.','<button class="btn" id="back-tools">← Semua alat</button>');
 html+='<div class="settings-grid"><section class="panel"><h2>Foto sumber</h2><p class="lead">Foto asli tidak ditimpa. Hasil AI ditampilkan dan dapat diunduh sebagai file terpisah.</p><div class="upload-zone" id="tool-upload-zone"><div style="font-size:26px">▧</div><b>Unggah foto untuk diproses</b><p>JPG, PNG atau WEBP</p><button class="btn small" id="tool-upload-button">Pilih foto</button><input type="file" id="tool-file-input" accept="image/*" hidden></div><div id="tool-preview" '+(!toolFileData?'class="hidden"':'')+'>'+(toolFileData?'<img src="'+toolFileData+'" style="width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#f0f1f6" alt="Foto sumber">':'')+'</div></section>';
 html+='<section class="panel"><h2>Pengaturan pemrosesan</h2><p class="lead">Fitur: '+esc(title)+'. Pilih model dan mode pemrosesan.</p><div class="field"><label>Model AI</label><select id="runner-model">'+modelOptions[key].map(m=>'<option value="'+m[0]+'" '+((settings.models[key]||'auto')===m[0]?'selected':'')+'>'+m[1]+'</option>').join('')+'</select></div><div class="field"><label>Mode</label><select id="runner-mode"><option value="fast">Cepat</option><option value="balanced">Seimbang</option><option value="quality">Kualitas tinggi</option></select></div>';
 if(key==='enhance')html+='<div class="control-line"><label>Kekuatan enhancement <span id="strength-value">60%</span></label><input id="enhance-strength" type="range" min="0" max="100" value="60"></div><div class="field"><label>Jenis peningkatan</label><select id="enhance-style"><option>Natural</option><option>Jernih / Sharp</option><option>Detail wajah</option><option>HDR</option></select><div class="hint">Natural memakai Real-ESRGAN. Gaya lain otomatis memakai Clarity Upscaler jika model diatur ke Otomatis.</div></div><div class="field"><label>Skala upscale</label><select id="upscale"><option>1×</option><option selected>2×</option><option>4×</option></select></div>';
 if(key==='blur')html+='<div class="control-line"><label>Kekuatan blur <span id="blur-value">12 px</span></label><input id="blur-strength" type="range" min="1" max="30" value="12"></div><div class="field"><label>Gaya bokeh</label><select id="blur-style"><option value="soft">Lembut</option><option value="circle">Lingkaran</option><option value="strong">Kuat</option></select><div class="hint">Subjek dipisahkan oleh fal.ai; blur latar digabung secara lokal agar subjek tetap tajam.</div></div>';
 if(key==='generate')html+='<div class="field"><label>Deskripsi background baru</label><textarea id="background-prompt" rows="4" placeholder="Contoh: taman bunga elegan, cahaya sore, gunung di kejauhan"></textarea><div class="hint">Bria Background Replace akan mengganti latar pada foto sumber dan berusaha mempertahankan subjek asli.</div></div>';
 if(key==='object')html+='<div class="field"><label>Objek yang ingin dihapus</label><input id="object-prompt" maxlength="300" placeholder="Contoh: orang di belakang, kabel, tulisan"></div><div class="notice info">fal.ai akan mencari objek berdasarkan deskripsi. Hasil dapat kurang tepat jika objek kecil, tertutup, atau mirip dengan objek lain.</div>';
 if(key==='remove')html+='<div class="notice info"><span>ⓘ</span><div>Hasil akan berupa PNG dengan latar transparan. Pemilihan model menentukan cara fal.ai memisahkan subjek.</div></div>';
 if(key==='gaze')html+='<div class="notice info">Hasil arah mata harus diperiksa sebelum digunakan. Model edit gambar dapat mengubah detail wajah dan tidak selalu menghasilkan pandangan natural.</div>';
 html+='<button class="btn primary" id="run-tool" style="width:100%">✧ Proses foto</button><div class="notice info" style="margin-top:12px"><span>ⓘ</span><div><b>Terhubung ke fal.ai.</b> Permintaan akan memakai API key sesi ini dan dapat menghabiskan saldo sesuai model. Foto asli tidak akan ditimpa.</div></div><div id="tool-result"></div></section></div>';
 $('#main').innerHTML=html;$('#back-tools').onclick=()=>{
  if(workflowReturn){
   const context=workflowReturn;workflowReturn=null;activeProjectId=context.projectId;
   const project=projects.find(x=>x.id===context.projectId);const index=project?project.photos.findIndex(x=>x.id===context.photoId):-1;
   activePhotoIndex=Math.max(0,index);page='photo-editor';render();return;
  }
  navTo('tools');
 };$('#tool-upload-button').onclick=()=>$('#tool-file-input').click();$('#tool-file-input').onchange=async e=>{const f=e.target.files[0];if(f){toolFileData=await dataURL(f);renderToolRunner()}};
 $('#runner-mode').value=settings.mode;$('#runner-model').onchange=()=>{settings.models[key]=$('#runner-model').value;saveSettings()};$('#enhance-strength')?.addEventListener('input',e=>{const el=$('#strength-value');if(el)el.textContent=e.target.value+'%'});$('#blur-strength')?.addEventListener('input',e=>{const el=$('#blur-value');if(el)el.textContent=e.target.value+' px'});
 $('#run-tool').onclick=async()=>{if(!toolFileData){toast('Unggah foto terlebih dahulu.');return}if(key==='enhance'){await runFalEnhancement();return}await runFalFeature()};
}
function confirmModal(title,text,action){showModal(title,'<p style="font-size:13px;line-height:1.6;color:#666b7f">'+esc(text)+'</p>','<button class="btn" id="confirm-cancel">Batal</button><button class="btn danger" id="confirm-yes">Ya, lanjutkan</button>');$('#confirm-cancel').onclick=closeModal;$('#confirm-yes').onclick=async()=>{closeModal();await action()}}
function wireNav(){$$('[data-page]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.page)))}
async function init(){
 try{db=await dbOpen()}catch(error){db=null;console.warn('IndexedDB tidak tersedia; mencoba penyimpanan cadangan.',error)}
 const [projectResult,templateResult,backgroundResult]=await Promise.allSettled([dbGetAll('projects'),dbGetAll('templates'),dbGetAll('backgrounds')]);
 projects=projectResult.status==='fulfilled'&&Array.isArray(projectResult.value)?projectResult.value:[];
 templates=templateResult.status==='fulfilled'&&Array.isArray(templateResult.value)?templateResult.value:[];
 backgrounds=backgroundResult.status==='fulfilled'&&Array.isArray(backgroundResult.value)?backgroundResult.value:[];
 if(projectResult.status==='rejected')console.error('Daftar proyek gagal dibaca.',projectResult.reason);
 if(templateResult.status==='rejected')console.error('Daftar template gagal dibaca.',templateResult.reason);
 if(backgroundResult.status==='rejected')console.error('Daftar background gagal dibaca.',backgroundResult.reason);
 try{wireNav()}catch(error){console.error('Navigasi utama gagal dipasang.',error)}
 render();
 startReangCenteredRangeObserver();
 if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
   if(window.__reangControllerReloadCheck)return;
   window.__reangControllerReloadCheck=true;
   setTimeout(()=>{
    const main=document.getElementById('main');
    const recoveryScreen=main&&main.querySelector('#boot-reload, #render-error-retry');
    if(!recoveryScreen||window.__reangCacheReloaded)return;
    window.__reangCacheReloaded=true;
    location.reload();
   },1200);
  },{once:true});
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(error=>console.warn('Service worker tidak diperbarui.',error));
 }
}
init();
})();
</script>
