.workflow-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 18px}
.workflow-step{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px;font-weight:750}
.workflow-step-num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f1f2f7;color:#7a8092;flex-shrink:0;font-size:11px}
.workflow-step.current{border-color:#b7afff;background:#f4f1ff;color:#4d40b5}
.workflow-step.current .workflow-step-num,.workflow-step.past .workflow-step-num{background:var(--accent);color:#fff}
.workflow-step.past{color:#217653;background:#f5fbf8;border-color:#d4efe1}
.workflow-photo-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.workflow-photo-bar h2{font-size:16px;margin:3px 0 4px;overflow-wrap:anywhere}
.workflow-photo-bar p{margin:0;color:var(--muted);font-size:12px}
.workflow-photo-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.workflow-editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:400px}
.workflow-preview{min-width:0;background:#eceef5;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.workflow-preview img{display:block;max-width:100%;width:auto;max-height:68vh;object-fit:contain;background:#fff;border-radius:12px;box-shadow:0 12px 28px #25283b22}
.workflow-controls{padding:22px;border-left:1px solid var(--line);min-width:0;background:#fff}
.workflow-controls .lead{font-size:12px;line-height:1.55;color:var(--muted)}
.workflow-primary{width:100%;margin-top:18px;white-space:normal}
.workflow-footer{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:14px 3px;font-size:11px;line-height:1.55}
@media(max-width:900px){.workflow-steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.workflow-step{padding:8px 5px;flex-direction:column;justify-content:center;text-align:center;gap:5px;font-size:10px}.workflow-editor{grid-template-columns:minmax(0,1fr)}.workflow-controls{border-left:0;border-top:1px solid var(--line)}.workflow-preview{min-height:280px}.workflow-photo-bar{align-items:flex-start;flex-direction:column}.workflow-photo-actions{width:100%}.workflow-footer{flex-direction:column}}
@media(max-width:430px){.workflow-step{font-size:9px}.workflow-step-num{width:22px;height:22px}.workflow-preview{padding:12px}.workflow-controls{padding:16px}}

/* Project gallery and per-photo editor flow */
body.photo-flow-active{background:#f7f8fb}
body.photo-flow-active .topbar,body.photo-flow-active .sidebar,body.photo-flow-active .mobile-nav{display:none!important}
body.photo-flow-active .layout{display:block;max-width:none;min-height:100dvh}
body.photo-flow-active .content{padding:0;min-height:100dvh}

.pf-gallery-page{min-height:100dvh;background:#f8f9fc;padding-bottom:28px}
.pf-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 14px;background:#fff;border-bottom:1px solid #eceef3}
.pf-header-title{flex:1;min-width:0}
.pf-header-title h1{font-size:18px;line-height:1.2;margin:0 0 4px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#202536}
.pf-header-title p{margin:0;font-size:12px;color:#9aa1af}
.pf-icon-btn{flex-shrink:0;border:0;background:transparent;color:#768090;font-size:27px;line-height:1;width:34px;height:40px;display:grid;place-items:center;border-radius:9px;padding:0}
.pf-icon-btn.orange{color:#e27c2e}
.pf-icon-btn.danger{color:#dd727d}
.pf-gallery-hint{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 18px 15px;font-size:13px;line-height:1.45;color:#77808f}
.pf-gallery-actions{flex-shrink:0}
.pf-text-btn{border:0;background:transparent;color:#dd7e30;font-weight:750;font-size:13px;padding:5px 3px;white-space:nowrap}
.pf-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 12px 18px}
.pf-photo-card{border:0;background:transparent;padding:0;min-width:0;text-align:left}

<script>
(function(){
  function showBootError(title, detail) {
    const main = document.getElementById('main');
    if (!main) return;
    main.innerHTML = '<section class="panel"><h2></h2><p class="lead"></p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:35vh;overflow:auto;background:#f5f6fa;padding:10px;border-radius:8px"></pre><button class="btn primary" id="boot-reload">Muat ulang aplikasi</button></section>';
    main.querySelector('h2').textContent = title;
    main.querySelector('.lead').textContent = 'Aplikasi mengalami kendala saat memuat. Detail di bawah dapat membantu perbaikan.';
    main.querySelector('pre').textContent = String(detail || 'Tidak ada detail error.');
    const button = document.getElementById('boot-reload');
    if (button) button.onclick = () => location.reload();
  }
  function showRuntimeNotice(message) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const item = document.createElement('div');
    item.className = 'toast';
    item.textContent = 'Terjadi kesalahan: ' + String(message || 'operasi tidak berhasil');
    root.replaceChildren(item);
  }
  window.addEventListener('error', function(event) {
    if (event.target && event.target !== window) return;
    const message = (event.message || 'Kesalahan JavaScript') + (event.filename ? '\n' + event.filename + ':' + event.lineno : '');
    if (!window.__reangAppBooted) showBootError('Reang Studio Foto belum berhasil dimuat', message);
    else { console.error(message); showRuntimeNotice(message); }
  });
  window.addEventListener('unhandledrejection', function(event) {
    const reason = event.reason;
    const message = reason && (reason.stack || reason.message) || String(reason);
    if (!window.__reangAppBooted) showBootError('Proses aplikasi mengalami kesalahan', message);
    else { console.error(message); showRuntimeNotice(message); }
  });
  window.addEventListener('load', function() {
    setTimeout(function() {
      const main = document.getElementById('main');
      if (main && !main.innerHTML.trim()) showBootError('Halaman utama belum tampil', 'Aplikasi dibuka tetapi belum berhasil merender konten. Tekan Muat ulang; jika tetap terjadi, kirim screenshot halaman ini.');
    }, 3000);
  });
})();
</script>

 $('#main').innerHTML=html;$('#fal-key').value=apiKeySession;

 $('#clear-api-key').addEventListener('click',()=>{$('#fal-key').value='';apiKeySession='';toast('Kolom API key dikosongkan.')});
 $('#test-fal-connection').addEventListener('click',async()=>{
   const b=$('#test-fal-connection'),status=$('#fal-connection-status');
   const apiKey=$('#fal-key').value.trim()||apiKeySession.trim();
   if(!apiKey){status.className='notice info';status.innerHTML='<span>ⓘ</span><div><b>API key belum diisi.</b> Masukkan API key fal.ai baru. Key tidak disimpan pada perangkat.</div>';return}
   b.disabled=true;b.textContent='Memeriksa…';status.className='notice info';status.innerHTML='<span>…</span><div><b>Menghubungi fal.ai secara langsung.</b> Tes hanya memeriksa status request ID acak yang tidak pernah dikirim untuk diproses; tidak membuat pekerjaan AI.</div>';
   try{
     const testId='reang-connectivity-check-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
     const response=await fetch('https://queue.fal.run/fal-ai/flux/schnell/requests/'+encodeURIComponent(testId)+'/status',{
       method:'GET',
       headers:{'Authorization':'Key '+apiKey,'Accept':'application/json'},
       cache:'no-store'
     });
     const body=await response.json().catch(()=>({}));
     const detail=String(body.detail||body.message||body.error||'').toLowerCase();
     if(response.status===401||response.status===403){
       status.className='notice error';status.innerHTML='<span>!</span><div><b>Fal.ai menolak API key (HTTP '+response.status+').</b> Pastikan key disalin lengkap dan masih aktif. Karena key lama sempat terlihat di chat, cabut key tersebut dan buat yang baru.</div>';
     }else if(response.status===404 && (detail.includes('request')||detail.includes('not found')||detail.includes('not_found')||!detail)){

     }else if(response.ok){
       status.className='notice success';status.innerHTML='<span>✓</span><div><b>Koneksi ke fal.ai berhasil.</b> Endpoint dapat dijangkau dan respons autentikasi diterima. Tes ini tidak membuat pekerjaan AI.</div>';
     }else{
       status.className='notice error';status.innerHTML='<span>!</span><div><b>Fal.ai merespons HTTP '+response.status+'.</b> '+String(body.detail||body.message||'Koneksi tercapai, tetapi respons tidak bisa memastikan API key valid. Periksa key dan coba lagi.').replace(/[&<>]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]})+'</div>';
     }
   }catch(error){
     status.className='notice error';status.innerHTML='<span>!</span><div><b>Gagal menghubungi fal.ai langsung.</b> Bisa karena koneksi internet atau kebijakan CORS pada WebView. Ini tidak otomatis berarti API key salah. Detail: '+String(error&&error.message||error).replace(/[&<>]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]})+'</div>';
   }finally{b.disabled=false;b.textContent='Tes koneksi fal.ai'}
 });

function renderErrorScreen(error, failedPage){
 const main=document.getElementById('main');
 document.body.classList.remove('photo-flow-active','photo-editor-active');
 if(!main)return;
 const detail=String(error&&(error.stack||error.message)||error||'Kesalahan tidak diketahui');
 main.innerHTML='<section class="panel" style="margin:18px auto;max-width:760px"><h2>Halaman tidak dapat ditampilkan</h2><p class="lead">Bagian halaman ini gagal dirender. Proyek dan foto tersimpan tidak dihapus.</p><pre id="render-error-detail" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:32vh;overflow:auto;background:#f5f6fa;padding:12px;border-radius:10px;font-size:11px"></pre><div class="form-row" style="grid-template-columns:1fr 1fr"><button class="btn primary" id="render-error-retry">Coba muat ulang halaman</button><button class="btn" id="render-error-projects">Kembali ke Proyek</button></div></section>';
 const pre=document.getElementById('render-error-detail');
 if(pre)pre.textContent=detail;
 const retry=document.getElementById('render-error-retry');
 if(retry)retry.onclick=()=>{page=failedPage||'projects';render()};
 const projectsButton=document.getElementById('render-error-projects');
 if(projectsButton)projectsButton.onclick=()=>{page='projects';render()};
}
function render(){
 const requestedPage=page;
 try{
  const photoFlow=page==='project-gallery'||page==='photo-editor';
  document.body.classList.toggle('photo-flow-active',photoFlow);
  document.body.classList.toggle('photo-editor-active',page==='photo-editor');
  switch(page){
   case 'project-gallery': renderProjectGallery(); break;
   case 'photo-editor': renderPhotoEditor(); break;
   case 'batch-workflow': page='project-gallery'; renderProjectGallery(); break;
   case 'projects': renderProjects(); break;
   case 'tools': renderTools(); break;
   case 'templates': renderTemplates(); break;
   case 'settings': renderSettings(); break;
   case 'project-editor': renderProjectEditor(); break;
   case 'template-editor': renderTemplateEditor(); break;
   case 'tool-runner': renderToolRunner(); break;
   default: page='projects'; renderProjects(); break;
  }
  setActivePageNav(page);
  window.__reangAppLastSuccessfulRender=Date.now();
  window.__reangAppBooted=true;
  return true;
 }catch(error){
  console.error('Gagal merender halaman '+requestedPage,error);
  page=requestedPage;
  renderErrorScreen(error,requestedPage);
  setActivePageNav(requestedPage);
  window.__reangAppBooted=true;
  return false;
 }
}

async function imageSizeFromData(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>resolve({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>resolve({w:0,h:0});im.src=src})}
async function handlePhotoUpload(files){const p=activeProject();if(!p)return;const list=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));if(!list.length)return;toast('Memuat '+list.length+' foto…');for(const file of list){try{const src=await dataURL(file);const dim=await imageSizeFromData(src);const photo={id:uid(),name:file.name,src,originalSrc:src,edited:false,adjust:{brightness:100,contrast:100,saturation:100},subject:{x:9,y:13,w:82,h:79},layers:[],finalThumb:null,width:dim.w,height:dim.h,createdAt:Date.now()};const tpl=templates.find(t=>t.id===p.templateId)||null;const preview=await renderComposite(p,photo,tpl,170);photo.finalThumb=preview.toDataURL('image/jpeg',.72);p.photos.push(photo)}catch(e){toast('Gagal membaca '+file.name)}}p.updatedAt=Date.now();for(const photo of p.photos){ensurePhotoWorkflow(photo);photo.workflowResults=photo.workflowResults||{}}p.workflowStage=0;await dbPut('projects',p);activePhotoIndex=Math.max(0,p.photos.length-list.length);page='project-gallery';render();toast(list.length+' foto ditambahkan.')}
function sizeForTemplate(t){let w=t.widthCm||29.7,h=t.heightCm||42;return{w,h,dpi:t.dpi||300}}
function normalizedToSize(n,size){return n/100*size}
function renderComposite(project,photo,template,previewWidth){
 const canvas=document.createElement('canvas');
 const size=template?sizeForTemplate(template):{w:29.7,h:42,dpi:300};
 const ratio=size.w/size.h;let outW=previewWidth||680;let outH=Math.round(outW/ratio);if(previewWidth<1500&&outH>1100){outH=1100;outW=Math.round(outH*ratio)}if(previewWidth>=1500&&outH>7000){outH=7000;outW=Math.round(outH*ratio)}

async function getLightBrushMaskCanvas(ph,mode){

function paintLightBrushSegment(maskCanvas,from,to,displayWidth,brush,erase){

 const x0=from.x*scale,y0=from.y*scale,x1=to.x*scale,y1=to.y*scale,dx=x1-x0,dy=y1-y0,distance=Math.sqrt(dx*dx+dy*dy);
 const radius=Math.max(1,maskCanvas.width*brush.size/200),steps=Math.max(1,Math.ceil(distance/Math.max(1,radius*.22))),innerStop=Math.max(0,Math.min(.98,1-brush.softness/100)),alpha=erase?1:brush.intensity/100;

  gradient.addColorStop(0,color);gradient.addColorStop(innerStop,color);gradient.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gradient;ctx.fillRect(x-radius,y-radius,radius*2,radius*2);

}

 const hasMask=photoHasLightBrushPaint(ph)||!!drawing;
 const global=adjustmentValues(ph),localValues=localLightAdjustmentValues(ph);
 const hasGlobalExtras=Math.abs(global.highlight)+Math.abs(global.shadows)+global.glow+global.vignette+Math.abs(global.blacks)+Math.abs(global.dehaze)>0;

async function applyAdditionalLightAdjustmentsToCanvas(canvas,a){
 const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 if(a.highlight!==0||a.shadows!==0){
  ctx.save();
  if(a.highlight>0){ctx.globalAlpha=Math.min(.18,Number(a.highlight)/600);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}
  else if(a.highlight<0){ctx.globalAlpha=Math.min(.15,Math.abs(Number(a.highlight))/700);ctx.fillStyle='#241c18';ctx.fillRect(0,0,w,h)}
  if(a.shadows>0){ctx.globalAlpha=Math.min(.10,Number(a.shadows)/900);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}
  else if(a.shadows<0){ctx.globalAlpha=Math.min(.14,Math.abs(Number(a.shadows))/700);ctx.fillStyle='#211b24';ctx.fillRect(0,0,w,h)}
  ctx.restore();
 }

  ctx.save();ctx.globalAlpha=Math.min(.16,Number(a.glow)/550);
  const g=ctx.createRadialGradient(w*.5,h*.42,0,w*.5,h*.42,Math.max(w,h)*.65);
  g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();
 }
 if(Number(a.vignette)>0){
  ctx.save();const g=ctx.createRadialGradient(w*.5,h*.5,Math.min(w,h)*.2,w*.5,h*.5,Math.max(w,h)*.68);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+Math.min(.48,a.vignette/210)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();
 }
}
async function applyBlacksAndDehazeToCanvas(canvas,adjustments){
 const black=Math.max(-100,Math.min(100,Number(adjustments.blacks)||0))/100;
 const dehaze=Math.max(-100,Math.min(100,Number(adjustments.dehaze)||0))/100;
 if(Math.abs(black)<.001&&Math.abs(dehaze)<.001)return;
 const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 if(Math.abs(black)>.001||dehaze>0){
  const frame=ctx.getImageData(0,0,w,h),d=frame.data;
  const lift=Math.max(0,black)*.30,crush=Math.max(0,-black)*.62,contrast=1+Math.max(0,dehaze)*.78,satGain=1+Math.max(0,dehaze)*.20;
  for(let i=0;i<d.length;i+=4){
   if(d[i+3]===0)continue;
   let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
   const lum=.2126*r+.7152*g+.0722*b,shadow=Math.pow(Math.max(0,1-lum),1.7);
   if(lift>0){const amount=lift*shadow;r+=amount;g+=amount;b+=amount}
   if(crush>0){const factor=Math.max(0,1-crush*shadow);r*=factor;g*=factor;b*=factor}
   if(dehaze>0){
    const y=.2126*r+.7152*g+.0722*b;
    r=y+(r-y)*satGain;g=y+(g-y)*satGain;b=y+(b-y)*satGain;
    r=(r-.5)*contrast+.5;g=(g-.5)*contrast+.5;b=(b-.5)*contrast+.5;
   }
   d[i]=Math.round(Math.max(0,Math.min(1,r))*255);
   d[i+1]=Math.round(Math.max(0,Math.min(1,g))*255);
   d[i+2]=Math.round(Math.max(0,Math.min(1,b))*255);
  }
  ctx.putImageData(frame,0,0);
 }
 if(dehaze<0){
  ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(255,255,255,'+(Math.abs(dehaze)*.34)+')';ctx.fillRect(0,0,w,h);ctx.restore();
 }
}

async function falJson(url, options, apiKey){
 const response=await fetch(url,{...options,headers:{'Authorization':'Key '+apiKey,'Accept':'application/json',...(options&&options.headers||{})}});
 const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch(_){data={detail:raw}}
 if(!response.ok){const msg=String(data.detail||data.message||data.error||('HTTP '+response.status));const e=new Error(msg);e.status=response.status;throw e}
 return data;
}
function prepareFalImage(source,maxSide=3000){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   try{
    const width=img.naturalWidth||img.width,height=img.naturalHeight||img.height;
    if(!width||!height){reject(new Error('Foto tidak dapat dibaca.'));return}
    if(source.startsWith('data:image/')&&source.length<6500000){resolve(source);return}
    const scale=Math.min(1,maxSide/Math.max(width,height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
    const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.92));
   }catch(err){reject(new Error('Gagal menyiapkan foto. Pilih file foto dari perangkat lalu coba lagi.'))}
  };
  img.onerror=()=>reject(new Error('Foto tidak dapat dibaca. Unggah ulang foto dalam format JPG atau PNG.'));
  img.src=source;
 });
}
function falWait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function falQueueRun(model,input,apiKey,onProgress){
 const job=await falJson('https://queue.fal.run/'+model,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)},apiKey);
 const requestId=job.request_id||job.requestId;
 if(!requestId)return job;
 const statusUrl=job.status_url||('https://queue.fal.run/'+model+'/requests/'+encodeURIComponent(requestId)+'/status');
 const resultUrl=job.response_url||('https://queue.fal.run/'+model+'/requests/'+encodeURIComponent(requestId));
 for(let attempt=0;attempt<180;attempt++){
  await falWait(2000);
  const status=await falJson(statusUrl,{method:'GET'},apiKey);
  const state=String(status.status||status.state||'').toUpperCase();
  if(onProgress)onProgress(state,attempt+1);
  if(state==='COMPLETED')return await falJson(resultUrl,{method:'GET'},apiKey);
  if(state==='FAILED'||state==='CANCELLED')throw new Error(status.error||status.detail||status.message||'Model fal.ai gagal memproses foto.');
 }
 throw new Error('Waktu tunggu habis. Coba periksa koneksi/saldo lalu jalankan kembali.');
}
function falImageUrl(output){
 const candidates=[
  output&&output.image,
  output&&Array.isArray(output.images)&&output.images[0],
  output&&output.data&&output.data.image,
  output&&output.data&&Array.isArray(output.data.images)&&output.data.images[0]
 ];
 for(const item of candidates){
  if(typeof item==='string'&&item)return item;
  if(item&&typeof item.url==='string'&&item.url)return item.url;
 }
 if(output&&typeof output.image_url==='string')return output.image_url;
 return null;
}
function loadCanvasImage(src){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  if(/^https?:/i.test(src))img.crossOrigin='anonymous';
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error('Gambar hasil tidak dapat dibaca untuk penggabungan. Pastikan koneksi ke media fal.ai mengizinkan akses gambar.'));
  img.src=src;
 });
}
async function makeBlurredBackgroundComposite(sourceUrl,cutoutUrl,strength){
 const base=await loadCanvasImage(sourceUrl),cutout=await loadCanvasImage(cutoutUrl);
 const w=base.naturalWidth||base.width,h=base.naturalHeight||base.height;
 if(!w||!h)throw new Error('Ukuran foto sumber tidak valid.');
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d');
 ctx.filter='blur('+Math.max(1,Math.min(30,strength))+'px)';
 const pad=Math.max(2,Math.ceil(strength*2));
 ctx.drawImage(base,-pad,-pad,w+pad*2,h+pad*2);
 ctx.filter='none';
 ctx.drawImage(cutout,0,0,w,h);
 return canvas.toDataURL('image/png');
}

 }

  const selectedModel=$('#runner-model').value;
  const scaleValue=parseFloat($('#upscale').value.replace('×',''))||2;
  const strength=Math.max(0,Math.min(100,Number($('#enhance-strength').value)||60));
  const useClarity=selectedModel==='clarity'||(selectedModel==='auto'&&style!=='Natural');
  const model=useClarity?'fal-ai/clarity-upscaler':'fal-ai/esrgan';
  let input;
  if(useClarity){
   const stylePrompt={
    'Natural':'photorealistic natural photo restoration, preserve the original subjects, exact facial identity, clothing, colors and composition, subtle details, realistic skin texture',
    'Jernih / Sharp':'photorealistic photo enhancement, clear details, crisp but natural sharpness, preserve original subjects and exact facial identity, realistic textures, no oversharpening',
    'Detail wajah':'photorealistic portrait restoration, improve facial clarity and fine details while preserving each person’s exact identity, facial structure, age, expression, skin texture and original composition',
    'HDR':'natural high dynamic range photo restoration, balanced highlights and shadows, realistic colors, preserve exact subjects, faces and composition'
   };
   input={image_url:inputImage,prompt:stylePrompt[style]||stylePrompt.Natural,upscale_factor:scaleValue,negative_prompt:'different person, altered face, extra fingers, changed clothing, changed background, text, watermark, oversaturated, plastic skin, illustration, cartoon, blurry, low quality',creativity:Math.max(0.08,Math.min(0.45,0.08+(strength/100)*0.37)),resemblance:Math.max(0.55,Math.min(0.95,0.95-(strength/100)*0.32)),guidance_scale:4,num_inference_steps:$('#runner-mode').value==='fast'?14:($('#runner-mode').value==='quality'?24:18),enable_safety_checker:true};
  }else{
   input={image_url:inputImage,scale:scaleValue,model:scaleValue===2?'RealESRGAN_x2plus':'RealESRGAN_x4plus',face:style==='Detail wajah',output_format:'png'};
  }
  result.innerHTML='<div class="notice info" role="status"><span>…</span><div><b>Mengirim foto ke '+(useClarity?'Clarity Upscaler':'Real-ESRGAN')+'…</b> Permintaan ini menggunakan fal.ai dan dapat menghabiskan saldo akun.</div></div>';
  const job=await falJson('https://queue.fal.run/'+model,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)},apiKey);
  let output=job;
  if(job.request_id||job.requestId){
   const requestId=job.request_id||job.requestId;
   const statusUrl=job.status_url||('https://queue.fal.run/'+model+'/requests/'+encodeURIComponent(requestId)+'/status');
   const resultUrl=job.response_url||('https://queue.fal.run/'+model+'/requests/'+encodeURIComponent(requestId));
   let completed=false;
   for(let attempt=0;attempt<180;attempt++){
    await falWait(2000);
    const status=await falJson(statusUrl,{method:'GET'},apiKey);
    const state=String(status.status||status.state||'').toUpperCase();
    const elapsed=Math.round((attempt+1)*2);
    result.innerHTML='<div class="notice info" role="status"><span>…</span><div><b>AI sedang memproses foto…</b> Status: '+esc(state||'menunggu')+'. Waktu berjalan '+elapsed+' detik.</div></div>';
    if(state==='COMPLETED'){completed=true;break}
    if(state==='FAILED'||state==='CANCELLED')throw new Error(status.error||status.detail||'Model fal.ai gagal memproses foto.');
   }
   if(!completed)throw new Error('Waktu tunggu pemrosesan terlalu lama. Coba periksa saldo/koneksi lalu ulangi.');
   output=await falJson(resultUrl,{method:'GET'},apiKey);
  }
  const imageObject=output.image||(Array.isArray(output.images)?output.images[0]:null)||(output.data&&output.data.image)||null;
  const imageUrl=typeof imageObject==='string'?imageObject:(imageObject&&imageObject.url)||(output.image_url)||null;
  if(!imageUrl)throw new Error('fal.ai merespons, tetapi URL gambar hasil tidak ditemukan. Coba ulangi atau pilih model lain.');
  const outputPath=imageUrl.toLowerCase().split(/[?#]/)[0];
  const outputExt=(outputPath.endsWith('.jpg')||outputPath.endsWith('.jpeg'))?'jpg':'png';
  showFalResult(imageUrl,'Pemrosesan AI selesai','reang-enhance-ai.'+outputExt);
 }catch(error){
  const message=String(error&&error.message||error);
  let suggestion='Periksa koneksi internet, saldo akun, dan model yang dipilih lalu coba kembali.';
  if(error&&error.status===401)suggestion='API key ditolak. Periksa key pada Pengaturan → AI & fal.ai; jangan gunakan key yang sudah dicabut.';
  else if(error&&error.status===403)suggestion='Akun atau API key tidak memiliki akses ke model ini. Cek izin akun dan model yang tersedia.';
  else if(error&&error.status===413)suggestion='Ukuran foto terlalu besar. Coba unggah foto yang lebih kecil.';
  else if(/failed to fetch|networkerror|cors/i.test(message))suggestion='Koneksi langsung terhalang jaringan atau kebijakan CORS WebView. Ini tidak selalu berarti API key salah.';
  result.innerHTML='<div class="notice error"><span>!</span><div><b>Enhancement AI gagal.</b> '+esc(message)+'<br>'+esc(suggestion)+'</div></div>';
 }finally{button.disabled=false;button.textContent='✧ Proses foto'}
}
function renderToolRunner(){
 const key=toolKey;let title=featureName[key]||'Alat AI';
 let html=head('ALAT AI / '+title.toUpperCase(),title,'Pemrosesan langsung melalui model fal.ai. Hasil tersimpan sebagai unduhan terpisah; foto sumber tidak ditimpa.','<button class="btn" id="back-tools">← Semua alat</button>');
 html+='<div class="settings-grid"><section class="panel"><h2>Foto sumber</h2><p class="lead">Foto asli tidak ditimpa. Hasil AI ditampilkan dan dapat diunduh sebagai file terpisah.</p><div class="upload-zone" id="tool-upload-zone"><div style="font-size:26px">▧</div><b>Unggah foto untuk diproses</b><p>JPG, PNG atau WEBP</p><button class="btn small" id="tool-upload-button">Pilih foto</button><input type="file" id="tool-file-input" accept="image/*" hidden></div><div id="tool-preview" '+(!toolFileData?'class="hidden"':'')+'>'+(toolFileData?'<img src="'+toolFileData+'" style="width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#f0f1f6" alt="Foto sumber">':'')+'</div></section>';
 html+='<section class="panel"><h2>Pengaturan pemrosesan</h2><p class="lead">Fitur: '+esc(title)+'. Pilih model dan mode pemrosesan.</p><div class="field"><label>Model AI</label><select id="runner-model">'+modelOptions[key].map(m=>'<option value="'+m[0]+'" '+((settings.models[key]||'auto')===m[0]?'selected':'')+'>'+m[1]+'</option>').join('')+'</select></div><div class="field"><label>Mode</label><select id="runner-mode"><option value="fast">Cepat</option><option value="balanced">Seimbang</option><option value="quality">Kualitas tinggi</option></select></div>';
 if(key==='enhance')html+='<div class="control-line"><label>Kekuatan enhancement <span id="strength-value">60%</span></label><input id="enhance-strength" type="range" min="0" max="100" value="60"></div><div class="field"><label>Jenis peningkatan</label><select id="enhance-style"><option>Natural</option><option>Jernih / Sharp</option><option>Detail wajah</option><option>HDR</option></select><div class="hint">Natural memakai Real-ESRGAN. Gaya lain otomatis memakai Clarity Upscaler jika model diatur ke Otomatis.</div></div><div class="field"><label>Skala upscale</label><select id="upscale"><option>1×</option><option selected>2×</option><option>4×</option></select></div>';
 if(key==='blur')html+='<div class="control-line"><label>Kekuatan blur <span id="blur-value">12 px</span></label><input id="blur-strength" type="range" min="1" max="30" value="12"></div><div class="field"><label>Gaya bokeh</label><select id="blur-style"><option value="soft">Lembut</option><option value="circle">Lingkaran</option><option value="strong">Kuat</option></select><div class="hint">Subjek dipisahkan oleh fal.ai; blur latar digabung secara lokal agar subjek tetap tajam.</div></div>';
 if(key==='generate')html+='<div class="field"><label>Deskripsi background baru</label><textarea id="background-prompt" rows="4" placeholder="Contoh: taman bunga elegan, cahaya sore, gunung di kejauhan"></textarea><div class="hint">Bria Background Replace akan mengganti latar pada foto sumber dan berusaha mempertahankan subjek asli.</div></div>';
 if(key==='object')html+='<div class="field"><label>Objek yang ingin dihapus</label><input id="object-prompt" maxlength="300" placeholder="Contoh: orang di belakang, kabel, tulisan"></div><div class="notice info">fal.ai akan mencari objek berdasarkan deskripsi. Hasil dapat kurang tepat jika objek kecil, tertutup, atau mirip dengan objek lain.</div>';
 if(key==='remove')html+='<div class="notice info"><span>ⓘ</span><div>Hasil akan berupa PNG dengan latar transparan. Pemilihan model menentukan cara fal.ai memisahkan subjek.</div></div>';
 if(key==='gaze')html+='<div class="notice info">Hasil arah mata harus diperiksa sebelum digunakan. Model edit gambar dapat mengubah detail wajah dan tidak selalu menghasilkan pandangan natural.</div>';
 html+='<button class="btn primary" id="run-tool" style="width:100%">✧ Proses foto</button><div class="notice info" style="margin-top:12px"><span>ⓘ</span><div><b>Terhubung ke fal.ai.</b> Permintaan akan memakai API key sesi ini dan dapat menghabiskan saldo sesuai model. Foto asli tidak akan ditimpa.</div></div><div id="tool-result"></div></section></div>';
 $('#main').innerHTML=html;$('#back-tools').onclick=()=>{
  if(workflowReturn){
   const context=workflowReturn;workflowReturn=null;activeProjectId=context.projectId;
   const project=projects.find(x=>x.id===context.projectId);const index=project?project.photos.findIndex(x=>x.id===context.photoId):-1;
   activePhotoIndex=Math.max(0,index);page='photo-editor';render();return;
  }
  navTo('tools');
 };$('#tool-upload-button').onclick=()=>$('#tool-file-input').click();$('#tool-file-input').onchange=async e=>{const f=e.target.files[0];if(f){toolFileData=await dataURL(f);renderToolRunner()}};
 $('#runner-mode').value=settings.mode;$('#runner-model').onchange=()=>{settings.models[key]=$('#runner-model').value;saveSettings()};$('#enhance-strength')?.addEventListener('input',e=>{const el=$('#strength-value');if(el)el.textContent=e.target.value+'%'});$('#blur-strength')?.addEventListener('input',e=>{const el=$('#blur-value');if(el)el.textContent=e.target.value+' px'});
 $('#run-tool').onclick=async()=>{if(!toolFileData){toast('Unggah foto terlebih dahulu.');return}if(key==='enhance'){await runFalEnhancement();return}await runFalFeature()};
}
function confirmModal(title,text,action){showModal(title,'<p style="font-size:13px;line-height:1.6;color:#666b7f">'+esc(text)+'</p>','<button class="btn" id="confirm-cancel">Batal</button><button class="btn danger" id="confirm-yes">Ya, lanjutkan</button>');$('#confirm-cancel').onclick=closeModal;$('#confirm-yes').onclick=async()=>{closeModal();await action()}}
function wireNav(){$$('[data-page]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.page)))}
async function init(){
 try{db=await dbOpen()}catch(error){db=null;console.warn('IndexedDB tidak tersedia; mencoba penyimpanan cadangan.',error)}
 const [projectResult,templateResult]=await Promise.allSettled([dbGetAll('projects'),dbGetAll('templates')]);
 projects=projectResult.status==='fulfilled'&&Array.isArray(projectResult.value)?projectResult.value:[];
 templates=templateResult.status==='fulfilled'&&Array.isArray(templateResult.value)?templateResult.value:[];
 if(projectResult.status==='rejected')console.error('Daftar proyek gagal dibaca.',projectResult.reason);
 if(templateResult.status==='rejected')console.error('Daftar template gagal dibaca.',templateResult.reason);
 try{wireNav()}catch(error){console.error('Navigasi utama gagal dipasang.',error)}
 render();
 if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
   if(window.__reangControllerReloadCheck)return;
   window.__reangControllerReloadCheck=true;
   setTimeout(()=>{
    const main=document.getElementById('main');
    const recoveryScreen=main&&main.querySelector('#boot-reload, #render-error-retry');
    if(!recoveryScreen||window.__reangCacheReloaded)return;
    window.__reangCacheReloaded=true;
    location.reload();
   },1200);
  },{once:true});
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(error=>console.warn('Service worker tidak diperbarui.',error));
 }
}
init();
})();
</script>
